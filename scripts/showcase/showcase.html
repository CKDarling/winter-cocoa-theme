<!doctype html>
<!--
  Source for images/showcase.png. The code mirrors examples/sunflower.py, hand-tokenized
  with the colors Winter Cocoa gives each scope (Pylance semantic colors where they win).
  Rebuild with: scripts/render_showcase.sh
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winter Cocoa Showcase</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=block">
<style>
  :root {
    --page: #110b0a;
    --editor: #1a1210;
    --hairline: #ffffff22;
    --text: #d9d6cf;
    --muted: #9c928b;
    --slate: #708090;
    --font-display: "Bricolage Grotesque", "Avenir Next", sans-serif;
    --font-body: "IBM Plex Sans", "Helvetica Neue", sans-serif;
    --font-code: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1280px;
    height: 940px;
    padding: 40px;
    background: var(--page);
    color: var(--text);
    font-family: var(--font-body);
    display: grid;
    grid-template-columns: 700px 1fr;
    gap: 40px;
    -webkit-font-smoothing: antialiased;
  }

  .window {
    display: grid;
    grid-template-rows: 36px 36px 1fr 24px;
    background: var(--editor);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 24px 60px #00000066;
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 14px;
    border-bottom: 1px solid var(--hairline);
    position: relative;
    font-size: 12px;
    color: var(--text);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .titlebar .name { position: absolute; left: 0; right: 0; text-align: center; color: #70809088; }
  .tabs { display: flex; border-bottom: 1px solid var(--hairline); font-size: 13px; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-right: 1px solid var(--hairline); }
  .tab.active { border-top: 1px solid var(--slate); }
  .tab.inactive { color: #70809099; }
  .py { width: 10px; height: 10px; border-radius: 2px; background: linear-gradient(135deg, #8aaec2 50%, #d4b99a 50%); }

  .code {
    padding-block: 12px;
    font-family: var(--font-code);
    font-size: 13.5px;
    line-height: 19px;
    font-variant-ligatures: none;
  }
  .ln { display: flex; white-space: pre; }
  .ln.cur { background: #3b2f2f55; }
  .gutter { flex: none; width: 52px; padding-right: 20px; text-align: right; color: #70809080; }
  .ln.cur .gutter { color: #d9d6cf; }
  .sel { background: #5c4033aa; }
  .caret { display: inline-block; width: 2px; height: 15px; margin-left: 1px; vertical-align: -3px; background: #d9d6cf; }

  .status {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 12px;
    border-top: 1px solid var(--hairline);
    font-size: 11.5px;
    color: #d9d6cfcc;
  }
  .status .right { margin-left: auto; display: flex; gap: 18px; }
  .remote { padding: 0 10px; height: 100%; display: flex; align-items: center; background: #708090; color: #1a1210; margin-left: -12px; font-weight: 500; }

  aside { display: grid; align-content: start; gap: 22px; padding-top: 6px; }
  .eyebrow { font-family: var(--font-code); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); }
  h1 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1.05; letter-spacing: -0.01em; }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; text-wrap: balance; }

  .legend { display: grid; gap: 0; }
  .row {
    display: grid;
    grid-template-columns: 16px 150px 1fr auto;
    align-items: center;
    gap: 14px;
    height: 46px;
    border-top: 1px solid #ffffff12;
    font-size: 14px;
  }
  .row:last-child { border-bottom: 1px solid #ffffff12; }
  .chip { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #ffffff22; }
  .role { color: var(--text); }
  .sample { font-family: var(--font-code); font-size: 13px; white-space: pre; overflow: hidden; font-variant-ligatures: none; }
  .hex { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
  .group { margin-top: 10px; }
</style>
</head>
<body>
  <section class="window">
    <div class="titlebar">
      <span class="dot" style="background:#a07070"></span>
      <span class="dot" style="background:#c09878"></span>
      <span class="dot" style="background:#7a907a"></span>
      <span class="name">sunflower.py — winter-cocoa-theme</span>
    </div>
    <div class="tabs">
      <span class="tab active"><span class="py"></span>sunflower.py</span>
      <span class="tab inactive">README.md</span>
    </div>
    <div class="code" id="code"></div>
    <div class="status">
      <span class="remote">main</span>
      <span>Ln 32, Col 70</span>
      <div class="right"><span>Spaces: 4</span><span>UTF-8</span><span>Python 3.12</span></div>
    </div>
  </section>

  <aside>
    <div>
      <div class="eyebrow">VS Code theme</div>
      <h1>Winter Cocoa</h1>
      <p class="sub">A warm dark theme in espresso, walnut and slate, with a distinct color for every part of a Python file.</p>
    </div>
    <div class="legend" id="legend"></div>
  </aside>

<script>
const STYLE = {
  kw: ["#c4978c"], ctrl: ["#c4978c", "b"], stor: ["#c4978c"], fpre: ["#c4978c"], glob: ["#c4978c"],
  fn: ["#8aaec2"], bi: ["#84aeb8"], type: ["#84aeb8"], magic: ["#84aeb8", "i"],
  cls: ["#d4b99a"], clsdef: ["#d4b99a", "b"],
  dec: ["#c09878", "i"], fb: ["#c09878"], esc: ["#c09878"],
  str: ["#a3b08a"], doc: ["#a3b08a", "i"],
  num: ["#b094a4"], const: ["#a07850", "b"], caps: ["#a07850"],
  self: ["#a08da0", "i"], cmt: ["#708090", "i"],
  param: ["#d9d6cfdd"], attr: ["#d9d6cfcc"], op: ["#d9d6cfbb"], punc: ["#d9d6cfaa"],
  mod: ["#d9d6cf"], v: ["#d9d6cf"],
};

// «kind:text» is a token, «!kind:text» sits inside the selection; unmarked text is a plain name.
const SRC = [
  "«kw:from» «mod:__future__» «kw:import» annotations",
  "",
  "«kw:import» «mod:json»",
  "«kw:from» «mod:dataclasses» «kw:import» «fn:dataclass»",
  "",
  "«caps:LUCAS_SEED» «op:=» «punc:(»«num:2»«punc:,» «num:1»«punc:)»  «cmt:# Fibonacci's sibling: 2, 1, 3, 4, 7, 11, ...»",
  "_checked«punc::» «type:int» «op:=» «num:0»",
  "",
  "",
  "«stor:def» «fn:is_prime»«punc:(»«param:n»«punc::» «type:int»«punc:)» «op:->» «type:bool»«punc::»",
  "    «glob:global» _checked",
  "    _checked «op:+=» «num:1»",
  "    «ctrl:return» «param:n» «op:>» «num:1» «op:and» «bi:all»«punc:(»«param:n» «op:%» d «ctrl:for» d «ctrl:in» «bi:range»«punc:(»«num:2»«punc:,» «type:int»«punc:(»«param:n»«op:**»«num:0.5»«punc:)» «op:+» «num:1»«punc:))»",
  "",
  "",
  "«dec:@dataclass»«punc:(»«param:frozen»«op:=»«const:True»«punc:)»",
  "«stor:class» «clsdef:Sunflower»«punc::»",
  "    «doc:\"\"\"A seed head whose spirals count out the Lucas numbers.\"\"\"»",
  "",
  "    name«punc::» «type:str»",
  "    spirals«punc::» «type:int» «op:=» «num:47»",
  "    note«punc::» «type:str» «op:|» «const:None» «op:=» «const:None»",
  "",
  "    «stor:def» «fn:lucas»«punc:(»«self:self»«punc:)» «op:->» «type:list»«punc:[»«type:int»«punc:]»«punc::»",
  "        seq «op:=» «bi:list»«punc:(»«caps:LUCAS_SEED»«punc:)»",
  "        «ctrl:while» seq«punc:[»«op:-»«num:1»«punc:]» «op:<» «self:self»«punc:.»«attr:spirals»«punc::»",
  "            seq«punc:.»«fn:append»«punc:(»seq«punc:[»«op:-»«num:1»«punc:]» «op:+» seq«punc:[»«op:-»«num:2»«punc:])»",
  "        «ctrl:return» seq",
  "",
  "    «stor:def» «fn:is_safe_prime»«punc:(»«self:self»«punc:)» «op:->» «type:bool»«punc::»",
  "        «cmt:# 47 = 2 * 23 + 1, and 23 is prime as well»",
  "        «ctrl:return» «fn:is_prime»«punc:(»«self:self»«punc:.»«attr:spirals»«punc:)» «op:and» «fn:is_prime»«punc:((»«!self:self»«!punc:.»«!attr:spirals»«!op: - »«!num:1»«punc:)» «op:/»«op:/» «num:2»«punc:)»",
  "",
  "",
  "«ctrl:if» «magic:__name__» «op:==» «str:\"__main__\"»«punc::»",
  "    head «op:=» «cls:Sunflower»«punc:(»«str:\"Helianthus\"»«punc:)»",
  "    «bi:print»«punc:(»«fpre:f»«str:\"»«fb:{»head«punc:.»«attr:name»«fb:}»«esc:\\t»«fb:{»head«punc:.»«fn:lucas»«punc:()»«fb:}»«str:\"»«punc:)»",
  "    «bi:print»«punc:(»«mod:json»«punc:.»«fn:dumps»«punc:({»«str:\"safe\"»«punc::» head«punc:.»«fn:is_safe_prime»«punc:(),» «str:\"checks\"»«punc::» _checked«punc:}))»",
];
const CURSOR_LINE = 32;

// role, chip color, sample tokens (same markup), hex label
const LEGEND = [
  ["Keywords", "#c4978c", "«stor:def»  «ctrl:while»  «ctrl:return»  «glob:global»", "#c4978c"],
  ["Functions", "#8aaec2", "«fn:is_prime»«punc:()»  «fn:lucas»«punc:()»", "#8aaec2"],
  ["Strings", "#a3b08a", "«str:\"Helianthus\"»  «doc:\"\"\"docs\"\"\"»", "#a3b08a"],
  ["Comments", "#708090", "«cmt:# 47 = 2 * 23 + 1»", "#708090"],
  ["Builtins & types", "#84aeb8", "«bi:len»  «type:int»  «type:str»  «magic:__name__»", "#84aeb8"],
  ["Classes", "#d4b99a", "«clsdef:Sunflower»  «cls:Sunflower»«punc:()»", "#d4b99a"],
  ["Decorators & escapes", "#c09878", "«dec:@dataclass»  «fb:{»head«fb:}»  «esc:\\n»", "#c09878"],
  ["Numbers", "#b094a4", "«num:47»  «num:0.5»", "#b094a4"],
  ["Constants", "#a07850", "«const:True»  «const:None»  «caps:LUCAS_SEED»", "#a07850"],
  ["self / cls", "#a08da0", "«self:self»«punc:.»«attr:spirals»", "#a08da0"],
  ["Names", "#d9d6cf", "head  seq  «param:n»", "#d9d6cf"],
];
const SURFACES = [
  ["Current line", "#3b2f2f", "#3b2f2f55"],
  ["Selection", "#5c4033", "#5c4033aa"],
];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function tokens(line, into) {
  const re = /«(!?)(\w+):([\s\S]*?)»/g;
  let last = 0, sel = null, m;
  const add = (kind, text, selected) => {
    const [color, flag] = STYLE[kind];
    const s = el("span", null, text);
    s.style.color = color;
    if (flag === "b") s.style.fontWeight = "700";
    if (flag === "i") s.style.fontStyle = "italic";
    if (selected) { sel = sel || into.appendChild(el("span", "sel")); sel.append(s); }
    else { sel = null; into.append(s); }
  };
  while ((m = re.exec(line))) {
    if (m.index > last) add("v", line.slice(last, m.index), false);
    add(m[2], m[3], m[1] === "!");
    last = re.lastIndex;
  }
  if (last < line.length) add("v", line.slice(last), false);
}

const code = document.getElementById("code");
SRC.forEach((line, i) => {
  const row = el("div", "ln" + (i + 1 === CURSOR_LINE ? " cur" : ""));
  row.append(el("span", "gutter", String(i + 1)));
  const src = el("span");
  tokens(line, src);
  if (i + 1 === CURSOR_LINE) src.append(el("span", "caret"));
  if (!line) src.append(" ");
  row.append(src);
  code.append(row);
});

const legend = document.getElementById("legend");
LEGEND.forEach(([role, chip, sample, hex]) => {
  const row = el("div", "row");
  const c = el("span", "chip"); c.style.background = chip;
  const s = el("span", "sample"); tokens(sample, s);
  row.append(c, el("span", "role", role), s, el("span", "hex", hex));
  legend.append(row);
});
SURFACES.forEach(([role, chip, hex], i) => {
  const row = el("div", "row" + (i === 0 ? " group" : ""));
  const c = el("span", "chip"); c.style.background = chip;
  const s = el("span", "sample");
  const bar = el("span", null, i === 0 ? "  while seq[-1] < n:  " : "self.spirals - 1");
  bar.style.background = hex;
  bar.style.color = "#d9d6cf";
  s.append(bar);
  row.append(c, el("span", "role", role), s, el("span", "hex", hex));
  legend.append(row);
});
</script>
</body>
</html>
